<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Donors | Source registry</title>
  <link rel="stylesheet" href="/css/all.min.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="icon" type="image/x-icon" href="../../rocket.ico">
  <link rel="stylesheet" href="../common/sidebar.css">

  <link rel="stylesheet" href="base.css">
  <script>
    (function() {
      const saved = localStorage.getItem('hercules_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  
</head>
<body>
  <div id="box">
    <div id="left">
            <div class="tools-section">
                <div class="tools-header">
                    <div class="tools-title" id="toolsTitle">
                        <i class="fas fa-tools black-icon"></i>
                        <span data-i18n="tool.menu.header"></span>
                    </div>
                    <button class="collapse-btn" id="collapseBtn" title="Collapse menu">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                <div class="tool-divider"></div>

                <div class="tools-grid" id="toolsGrid">
                    <div class="tools-loader">
                        <i class="fas fa-spinner fa-spin"></i><br>
                        Loading...
                    </div>
                </div>

                <div class="tool-divider"></div>
                <div class="tools-grid">
                    
                    <a href="/history">
                        <div class="tool-item">
                            <div class="tool-icon">
                                <i class="fas fa-history black-icon"></i>
                            </div>
                            <div class="tool-info">
                                <span class="tool-name" data-i18n="tool.menu.history"></span>
                                <span class="tool-desc" data-i18n="tool.menu.history.desc"></span>
                            </div>
                        </div>
                    </a>
                    <a href="/config">
                        <div class="tool-item">
                            <div class="tool-icon">
                                <i class="fas fa-cogs black-icon"></i>
                            </div>
                            <div class="tool-info">
                                <span class="tool-name" data-i18n="tool.menu.config" ></span>
                                <span class="tool-desc" data-i18n="tool.menu.config.desc"></span>
                            </div>
                        </div>
                    </a>
                </div>
                 <div class="tool-divider"></div>
            </div>
        </div>

    <div id="center">
      <div class="top-bar">
        <div class="top-bar-title"><i class="fas fa-database black-icon"></i><span data-i18n="donor.page.header"></span></div>
        <div class="top-bar-actions">
          <button class="header-btn" style="cursor: pointer;" id="addBtn"><i class="fas fa-plus"></i> <span data-i18n="common.btn.new"></span></button>
          <button class="theme-toggle btn btn-secondary" id="themeToggle" style="width:34px;height:34px;padding:0;justify-content:center;">
            <i class="fas fa-sun icon-sun" style="display:none;"></i>
            <i class="fas fa-moon icon-moon"></i>
          </button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-i18n="donor.page.name"></th>
              <th data-i18n="donor.page.provider"></th>
              <th data-i18n="donor.page.type"></th></th>
              <th data-i18n="donor.page.format"></th></th>
              <th data-i18n="donor.page.destination"></th>
              <th style="text-align:right;" data-i18n="donor.page.action">Actions</th>
          </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="6" class="empty-state">
            <i class="fas fa-database" style="font-size:2rem;opacity:.3;display:block;margin-bottom:8px;"></i>
              <span data-i18n="donor.page.empty"></span>
        </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
 <div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">
                <i class="fas fa-plus-circle"></i>
                <span data-i18n="donor.modal.titleAdd">Upload Data Contract</span>
            </div>
            <button class="modal-close" type="button" onclick="closeModal()">&times;</button>
        </div>

        <div class="modal-body">
            <input type="hidden" id="fId">

            <div class="upload-drop" id="contractUploadDrop">
                <i class="fas fa-cloud-upload-alt"></i>
                <p id="contractDropTitle" data-i18n="donor.page.select.contract">Click or drag file here</p>
                <small id="contractDropHint" data-i18n="donor.page.select.contract.format">YAML, YML, JSON — up to 1 MB</small>
                <input type="file" id="contractFileInput" accept=".yaml,.yml,.json" hidden>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" onclick="closeModal()" data-i18n="common.btn.cancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="saveBtn" disabled>
                <i class="fas fa-save"></i>
                <span data-i18n="common.btn.save">Save</span>
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay modal-danger" id="deleteModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">
                <i class="fas fa-trash-can"></i> 
                <span data-i18n="donor.modal.title.delete"></span>
            </div>
            <button class="modal-close" type="button" onclick="closeDeleteModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="warning-text">
                <i class="fas fa-exclamation-triangle"></i>
                Are you sure you want to delete source <strong id="deleteDonorName"></strong>?
            </div>
            <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 0.5rem;">
                This action is irreversible.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" onclick="closeDeleteModal()" data-i18n="common.btn.cancel"></button>
            <button class="btn btn-primary" type="button" id="deleteConfirmBtn">
                <i class="fas fa-trash-can"></i> 
                <span data-i18n="common.btn.delete"></span>
            </button>
        </div>
    </div>
</div>
  <div id="toast" class="toast"></div>
           <script type="text/javascript" src="../locales/i18n.js"></script>
      <script type="text/javascript" src="donor.js"></script>
    <script type="text/javascript" src="../common/preloader.js"></script>
    <script type="text/javascript" src="../common/info.js"></script>
    <script type="text/javascript" src="../common/menu.js"></script>
    <script type="text/javascript" src="../common/sidebar.js"></script>
 <script>

loadMeta().then(load);
    loadMenu();
  </script>

</body>
</html>
