<!DOCTYPE html>
<html data-page="extensions" data-version="1.27.0" lang="ru">
<head>
    <title>Геркулес | Расширения</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="addon.css">
    <link rel="stylesheet" href="sidebar.css">   
    <link rel="stylesheet" href="main.css">   
    <link rel="stylesheet" href="modal.css">
    <link rel="icon" type="image/x-icon" href="/rocket.ico">
</head>
<body>
    <div id="box" class="fade-in">
        <div id="left">
            <div class="tools-section">
                <div class="tools-header">
                    <div class="tools-title" id="toolsTitle">
                        <i class="fas fa-tools black-icon"></i>
                        <span>Инструменты</span>
                    </div>
                    <button class="collapse-btn" id="collapseBtn" title="Свернуть меню">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                <div class="tool-divider"></div>
                
                <div class="tools-grid" id="toolsGrid">
                    <div class="tools-loader">
                        <i class="fas fa-spinner fa-spin"></i><br>
                        Загрузка...
                    </div>
                </div>
                
                <div class="tool-divider"></div>
                <a href="/addon" style="text-decoration: none;">
                    <div class="tool-item" id="addonToolItem">
                        <div class="tool-icon">
                            <i class="fa fa-puzzle-piece black-icon"></i> 
                        </div>
                        <div class="tool-info">
                            <span class="tool-name">Расширения</span>
                            <span class="tool-desc">Максимум возможностей</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        
        <div id="center">
            <div class="extensions-header">
                <div>
                    <h2><i class="fas fa-puzzle-piece black-icon"></i> Расширения</h2>
                    <p>Расширьте возможности Геркулеса с помощью плагинов и интеграций</p>
                </div>
                <button class="addon-button" id="addExtensionBtn">
                    <i class="fas fa-plus"></i> Добавить расширение
                </button>
            </div>
            
            <div class="categories-container" id="categoriesContainer"></div>
            
            <div class="extensions-grid" id="extensionsGrid">
                <div class="coming-soon">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Загрузка расширений...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для загрузки расширения -->
    <div id="addonModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus"></i> Добавить расширение</h3>
                <span class="modal-close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">
                        <strong>Нажмите для выбора</strong> или перетащите архив<br>
                        <small>Поддерживаются ZIP, TAR, TAR.GZ (до 50МБ)</small>
                    </div>
                    <input type="file" id="fileInput" accept=".zip,.tar,.gz,.tgz" style="display:none">
                </div>
                
                <div id="fileInfo" class="file-info">
                    <i class="fas fa-file-archive"></i>
                    <span class="file-name" id="fileName"></span>
                </div>
                
                <div id="uploadStatus" class="upload-status"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
                <button class="btn btn-primary" id="submitBtn" disabled>Отправить на проверку</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="text/javascript" src="sidebar.js"></script>
    <script type="text/javascript" src="main.js"></script>
    <script type="text/javascript" src="modal.js"></script>
    <script type="text/javascript" src="menu.js"></script>
    <script>
        loadMenu();
    </script>
</body>
</html>
