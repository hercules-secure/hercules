<!DOCTYPE html>
<html data-page="history" data-version="1.27.0" lang="en">
<head>
    <title>Scan History</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../rocket.ico">

    <link rel="stylesheet" href="../common/modal.css">
    <link rel="stylesheet" href="../common/sidebar.css">
    <link rel="stylesheet" href="history.css">

    <script>
        (function() {
            const saved = localStorage.getItem('hercules_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>
    <div id="box">
        <!-- SIDEBAR -->
        <div id="left">
            <div class="tools-section">
                <div class="tools-header">
                    <div class="tools-title" id="toolsTitle">
                        <i class="fas fa-tools black-icon"></i>
                        <span>Tools</span>
                    </div>
                    <button class="collapse-btn" id="collapseBtn" title="Collapse menu">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                <div class="tool-divider"></div>

                <div class="tools-grid" id="toolsGrid">
                    <div class="tools-loader">
                        <i class="fas fa-spinner fa-spin"></i><br>
                        Loading...
                    </div>
                </div>

                <div class="tool-divider"></div>
                <div class="tools-grid">
                    <div class="tool-item">
                        <div class="tool-icon"><i class="fas fa-history black-icon"></i></div>
                        <div class="tool-info">
                            <span class="tool-name">History</span>
                            <span class="tool-desc">Scan log</span>
                        </div>
                    </div>
                    <a href="/config">
                        <div class="tool-item">
                            <div class="tool-icon"><i class="fas fa-cogs black-icon"></i></div>
                            <div class="tool-info">
                                <span class="tool-name">Settings</span>
                                <span class="tool-desc">Manage parameters</span>
                            </div>
                        </div>
                    </a>
                </div>
                 <div class="tool-divider"></div>
            </div>
        </div>

        <!-- CENTER -->
        <div id="center">
            <div class="top-bar">
                <div class="top-bar-title">
                    <i class="fas fa-history black-icon"></i>
                    <span>Scan History</span>
                </div>
                <div class="top-bar-actions">
                    <button class="header-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="header-btn" id="clearHistoryBtn">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                        <i class="fas fa-sun icon-sun"></i>
                        <i class="fas fa-moon icon-moon"></i>
                    </button>
                </div>
            </div>

            <!-- TABLE CARD (CMDB style) -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Tool</th>
                            <th>Source Type</th>
                            <th>Source</th>
                            <th>Date &amp; Time</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i><br>
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="table-footer">
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <!-- ============ DETAIL MODAL ============ -->


<!-- ============ CLEAR CONFIRM MODAL ============ -->
<div class="modal-overlay modal-danger" id="confirmModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">
                <i class="fas fa-triangle-exclamation"></i> Clear all history?
            </div>
            <button class="modal-close" type="button" data-close>&times;</button>
        </div>
        <div class="modal-body">
            <div class="warning-text">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Are you sure you want to <strong>clear all scan history</strong>?</span>
            </div>
            <p class="hint-text">
                <i class="fas fa-info-circle"></i>
                All scan records will be permanently deleted. This action is irreversible.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-close>Cancel</button>
            <button class="btn btn-primary btn-danger" type="button" id="confirmClearBtn">
                <i class="fas fa-trash-can"></i> Clear history
            </button>
        </div>
    </div>
</div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- SCRIPTS -->
    <script type="text/javascript" src="../common/info.js"></script>
    <script type="text/javascript" src="../common/menu.js"></script>
    <script type="text/javascript" src="../common/sidebar.js"></script>
    <script type="text/javascript" src="../common/modal.js"></script>
    <script type="module" src="history.js"></script>
</body>
</html>
