<!DOCTYPE html>
<html data-page="construction" data-version="1.27.0" lang="ru">
<head>
    <title>Геркулес | Настройки и параметры</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../common/main.css">
    <link rel="stylesheet" href="../common/sidebar.css"> 
    <link rel="stylesheet" href="config.css">
    <link rel="icon" type="image/x-icon" href="../rocket.ico">
</head>
<body>
    <div id="box" class="fade-in">
        <!-- ЛЕВАЯ КОЛОНКА - МЕНЮ ИНСТРУМЕНТОВ -->
        <div id="left">
            <div class="tools-section">
                <div class="tools-header">
                    <div class="tools-title" id="toolsTitle">
                        <i class="fas fa-tools black-icon"></i>
                        <span>Инструменты</span>
                    </div>
                    <button class="collapse-btn" id="collapseBtn" title="Свернуть меню">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                <div class="tool-divider"></div>
                
                <div class="tools-grid" id="toolsGrid">
                    <div class="tools-loader">
                        <i class="fas fa-spinner fa-spin"></i><br>
                        Загрузка...
                    </div>
                </div>
            
                <div class="tool-divider"></div>
                <div class="tools-grid">
                    <div class="tool-item">
                        <div class="tool-icon">
                            <i class="fas fa-cogs black-icon"></i>
                        </div>
                        <div class="tool-info">
                            <span class="tool-name">Настройки</span>
                            <span class="tool-desc">Управление параметрами</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА - НАСТРОЙКИ -->
        <div id="center">
            
            <div class="settings-container">
                <h2 class="section-title">
                    Настройки и параметры
                </h2>
                <!-- БЛОК: Версия и обновления -->
                <div class="settings-section" style="margin-top: 12px;">
                    <div class="settings-section-title">
                        <i class="fas fa-code-branch black-icon"></i>
                        <span>Версия и обновления</span>
                    </div>
                    
                    <!-- Текущая версия -->
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-label">Текущая версия</div>
                            <div class="setting-description">Установленная версия платформы</div>
                        </div>
                        <div class="version-badge">
                            <span class="version-number">v1.0.1</span>
                            <span class="version-status latest">Актуальная</span>
                        </div>
                    </div>
                    
                   
                    <!-- Информация о лицензии -->
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-label">Лицензия</div>
                            <div class="setting-description">Тип лицензии и срок действия</div>
                        </div>
                        <div class="license-info">
                            <span class="license-type">MIT / Open Source</span>
                            <span class="license-expiry">Бессрочная</span>
                        </div>
                    </div>
                    
                </div>

            </div>
        </div>
    </div>
    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="../common/menu.js"></script>
    <script type="text/javascript" src="../common/sidebar.js"></script>
    <script>
        loadMenu();

        
    </script>
</body>
</html>
