<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геркулес | Войти с помощью</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script type="text/javascript" src="/js/auth.js"></script>
    <link rel="icon" type="image/x-icon" href="/rocket.ico">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Геркулес</h1>
                <p class="subtitle">Войдите с помощью</p>
            </div>

            <div class="providers">
                <!-- Google -->
                <button class="provider-btn google" onclick="handleProviderLogin('google')" id="google-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>

                <!-- Яндекс -->
                <button class="provider-btn yandex" onclick="handleProviderLogin('yandex')" id="yandex-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="12" height="24" viewBox="0 0 12 24">
                    <path fill="currentColor" d="M7.083 14.8L2.985 24H-.001l4.5-9.834C2.385 13.092.974 11.148.974 7.552.969 2.518 4.159.001 7.953.001h3.858v24H9.229v-9.2H7.083zM9.23 2.18H7.852c-2.08 0-4.097 1.378-4.097 5.372c0 3.858 1.847 5.1 4.097 5.1H9.23z"/>
                    </svg>
                    <span>Яндекс</span>
                </button>
                <button class="provider-btn mailru" onclick="handleProviderLogin('mailru')" id="mailru-btn">
                    <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 0C6.716 0 0 6.716 0 15c0 8.284 6.716 15 15 15 3.03 0 5.946-0.902 8.44-2.609l-2.021-2.349C19.5 26.268 17.276 26.922 15 26.922c-6.576 0-11.922-5.346-11.922-11.922 0-6.576 5.346-11.922 11.922-11.922 6.576 0 11.922 5.346 11.922 11.922 0 0.852-0.094 1.714-0.28 2.562-0.377 1.546-1.463 2.02-2.277 1.958-0.819-0.067-1.777-0.65-1.783-2.077V15c0-4.18-3.403-7.583-7.583-7.583S7.417 10.82 7.417 15s3.403 7.583 7.583 7.583c2.032 0 3.937-0.795 5.374-2.239 0.835 1.3 2.198 2.115 3.748 2.239 0.133 0.011 0.269 0.017 0.404 0.017 1.091 0 2.173-0.365 3.045-1.028 0.9-0.682 1.571-1.67 1.942-2.856C29.866 17.118 30 16.169 30 15 30 6.716 23.284 0 15 0z" fill="currentColor"/>
                    </svg>
                    <span>Mail.ru</span>
                </button>
            </div>
             <div onclick="history.back()" style="display: flex;justify-content: center;align-items: center; font-size:12px; text-decoration: underline;cursor: pointer;">
                Назад
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification" style="display: none;">
        <div class="notification-icon"></div>
        <div class="notification-message"></div>
        <div class="notification-close" onclick="hideNotification()">×</div>
    </div>

</body>
</html>
