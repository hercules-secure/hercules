<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
    <script type="text/javascript" src="/js/samm.js"></script>
    <link rel="stylesheet" href="/css/samm.css">
    <link rel="icon" type="image/x-icon" href="/rocket.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <title>Геркулес | Оценка зрелости процессов безопасности разработки | Оптимизированая версия</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <i class="fas fa-shield-alt"></i>
                <span>Оценка зрелости процессов безопасности разработки</span>
            </h1>
            <p class="subtitle">Интерактивная анкета оценки зрелости процессов безопасности разработки | Оптимизированая версия</p>
        </header>

        <section class="progress-section">
            <div class="overall-score">
                <div class="score-circle" id="overallScore">
                    <svg viewBox="0 0 150 150">
                        <circle class="bg-circle" cx="75" cy="75" r="70"></circle>
                        <circle class="progress-circle" cx="75" cy="75" r="70" style="--score: 0;"></circle>
                    </svg>
                    <div class="score-text">
                        <div class="score-number" id="scorePercentage">0</div>
                        <div class="score-label">% зрелости</div>
                    </div>
                </div>
                
                <div class="score-details" id="overallDetails">
                    <div class="score-item"><div class="score-item-label">Управление</div><div class="score-item-value" id="scoreGovernance">0%</div></div>
                    <div class="score-item"><div class="score-item-label">Проектирование</div><div class="score-item-value" id="scoreDesign">0%</div></div>
                    <div class="score-item"><div class="score-item-label">Разработка</div><div class="score-item-value" id="scoreDevelopment">0%</div></div>
                    <div class="score-item"><div class="score-item-label">Проверка</div><div class="score-item-value" id="scoreVerification">0%</div></div>
                    <div class="score-item"><div class="score-item-label">Эксплуатация</div><div class="score-item-value" id="scoreOperations">0%</div></div>
                </div>
            </div>
        </section>

        <div class="bf-grid" id="sammGrid"></div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
