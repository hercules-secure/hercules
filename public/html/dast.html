    <style>
        /* Центральная колонка на всю ширину */

            justify-content: center !important;
            align-items: center !important;
            text-align: center !important;
            padding: 2rem !important;
        }
        
        /* tools-row - строка */

            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 2rem !important;
            margin-top: 2rem !important;
        }
        
        .tools-row .tool-item {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
        }

        }

        }

            margin-top: 0.25rem !important;

        /* Таймер - без лишних эффектов */

            background: transparent !important;

            padding: 0.5rem !important;
        }
        
        .timer-item:hover {
            transform: none !important;
            box-shadow: none !important;
        }
        
        .countdown-container {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            min-width: 400px;
        }
        
        .timer-number {
            font-size: 2rem !important;
            font-weight: 700;
            color: var(--primary);
        }
        
        .timer-label {

            color: var(--text-secondary);

        /* Ракета */

        .timer {

            justify-content: center;
            gap: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="box" class="fade-in">

                <div class="tools-header">

                    <a href="https://hercules-web.ru/#extensions" style="text-decoration: none;" target="_blank">

            <h2>Скоро все начнется</h2>
            
            <div class="countdown-container">
                <h3>Сервис будет доступен через:</h3>

                    <div class="timer-item" style="text-align: center;">
                        <div class="timer-number" id="minutes">00</div>
                        <div class="timer-label">Минут</div>
                    </div>
                    <div class="timer-item" style="text-align: center;">

                    </div>
                </div>
            </div>
            
            <div class="tools-row">
                <a href="/sca" style="text-decoration: none;">

                        <span class="tool-name">SAST</span>
                    </div>
                </a>
                <div class="tool-item">
                    <div class="tool-icon">
                        <i class="fa-solid fa-bug"></i>
                    </div>
                    <span class="tool-name">DAST</span>
                </div>
                <a href="/fuzz" style="text-decoration: none;">
                    <div class="tool-item">
                        <div class="tool-icon">
                            <i class="fa-solid fa-bullseye"></i>
                        </div>
                        <span class="tool-name">FUZZ</span>
                    </div>
                </a>
            </div>
        </div>
        
    </div>

    <script>
        // Устанавливаем дату запуска (через 90 дней от 2026-07-29)
        function getLaunchDate() {
            const now = new Date('2026-07-29T00:00:00');
            const launchDate = new Date(now);
            launchDate.setDate(now.getDate() + 90);
            return launchDate;
        }

        function updateCountdown() {
            const launchDate = getLaunchDate();
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

    <script type="text/javascript" src="/js/main/sidebar.js"></script>    
</body>
</html>
