<!DOCTYPE html>
<html data-page="extensions" data-version="1.27.0" lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/css/main/sidebar.css">

<body>
    <div id="box" class="fade-in">
        <div id="left">
            <div class="tools-section">
                <div class="tools-header">

                        <i class="fas fa-tools black-icon"></i>

                    </div>
                    <button class="collapse-btn" id="collapseBtn" title="Свернуть меню">

                    </button>
                </div>
                <div class="tool-divider"></div>
                <div class="tools-grid">
                    <a href="/sca" style="text-decoration: none;">
                        <div class="tool-item">
                            <div class="tool-icon">
                                <i class="fas fa-sitemap black-icon" title="Композиционный анализ"></i>
                            </div>
                            <div class="tool-info">
                                <span class="tool-name">SCA</span>
                                <span class="tool-desc">Композиционный анализ</span>
                            </div>
                        </div>
                    </a>
                    <a href="/sast" style="text-decoration: none;">
                        <div class="tool-item">
                            <div class="tool-icon">
                                <i class="fas fa-code black-icon" title="Анализ исходного кода"></i>
                            </div>
                            <div class="tool-info">
                                <span class="tool-name">SAST</span>
                                <span class="tool-desc">Анализ исходного кода</span>
                            </div>
                        </div>
                    </a>
                    <a href="/fuzz" style="text-decoration: none;">
                        <div class="tool-item">
                            <div class="tool-icon">
                                <i class="fa-solid fa-bullseye black-icon" title="Анализ API"></i>
                            </div>
                            <div class="tool-info">
                                <span class="tool-name">FUZZ</span>
                                <span class="tool-desc">Анализ API</span>
                            </div>
                        </div>
                    </a> 
                    <div class="tool-divider"></div>
                    <div class="tool-item active">
                        <div class="tool-icon">
                            <i class="fas fa-puzzle-piece black-icon"></i> 
                        </div>
                        <div class="tool-info">
                            <span class="tool-name">Расширения</span>
                            <span class="tool-desc">Максимум возможностей</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА - РАСШИРЕНИЯ -->
        <div id="center">
            <div class="extensions-header">
                <h2><i class="fas fa-puzzle-piece black-icon"></i> Расширения</h2>
                <p>Расширьте возможности Геркулеса с помощью плагинов и интеграций</p>
            </div>
            
<div class="categories-container" id="categoriesContainer"></div>
            
            <div class="extensions-grid" id="extensionsGrid">
                <div class="coming-soon">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Загрузка расширений...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="text/javascript" src="/js/main/sidebar.js"></script>
