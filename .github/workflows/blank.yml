name: Create Release Branch

on:
  # Запуск вручную из интерфейса GitHub (самый гибкий вариант)
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: 1.2.3)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch
        id: create_branch
        uses: peterjgrainger/action-create-branch@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Название ветки: release/1.2.3
          branch: 'release/${{ github.event.inputs.version }}'
          # Берем последний коммит из main
          sha: '${{ github.sha }}'

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Создаем PR из новой ветки в main
          gh pr create \
            --title "Release v${{ github.event.inputs.version }}" \
            --body "Автоматический PR для релиза версии ${{ github.event.inputs.version }}. Пожалуйста, проверьте изменения." \
            --base main \
            --head release/${{ github.event.inputs.version }}
