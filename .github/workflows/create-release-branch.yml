name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch
        run: |
          git checkout -b release/${{ github.event.inputs.version }}
          git push origin release/${{ github.event.inputs.version }}

      - name: Update version file (create a change)
        run: |
          # Создаем или обновляем файл с версией
          echo "{\"version\": \"${{ github.event.inputs.version }}\", \"releaseDate\": \"$(date -Iseconds)\"}" > version.json
          
          # Или если нет файла version.json, можно обновить README
          # echo "## Release ${{ github.event.inputs.version }}" >> RELEASE_NOTES.md
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add version.json
          git commit -m "Bump version to ${{ github.event.inputs.version }}"
          git push origin release/${{ github.event.inputs.version }}

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release v${{ github.event.inputs.version }}" \
            --body "## Что входит в релиз v${{ github.event.inputs.version }}
